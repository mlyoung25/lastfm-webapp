name: Keep Render awake

on:
  schedule:
    # Request every 5 min — GitHub often delays scheduled runs to ~1–3 h on
    # public repos. The job below pings every 5 min for up to 6 h so coverage
    # continues between delayed triggers.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Ping health check every 5 minutes
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          url="${APP_URL:-https://lastfm-webapp.onrender.com}"
          health="${url%/}/healthz"
          interval=300
          echo "Pinging ${health} every ${interval}s until job timeout (6h max)"
          while true; do
            echo "--- $(date -u +%Y-%m-%dT%H:%M:%SZ) ---"
            for i in 1 2 3; do
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$health") || status=000
              echo "Attempt $i: HTTP $status"
              if [ "$status" -ge 200 ] 2>/dev/null && [ "$status" -lt 400 ] 2>/dev/null; then
                break
              fi
              sleep 5
            done
            sleep "$interval"
          done
